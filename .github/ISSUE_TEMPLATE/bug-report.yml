name: Bug report
description: Report a reproducible problem without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, tokens, real users' details, photos with private locations, or security exploit details.
        For security issues, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem using fictional data where possible.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: App version or commit, browser, operating system, and whether this is a local development instance.
