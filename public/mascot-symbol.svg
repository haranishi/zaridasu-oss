<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="ザリダスのシンボル">
  <!--
    ザリダス シンボル（favicon / アプリアイコン用・単純化版）
    FR-225-05: 20px でも識別できるよう、識別フックを「丸い体＋大きなハサミ2本」に絞り、
    触角・歩脚・尾の細部を省略。色も白1色のベタで太く（角丸赤地に乗せる前提）。
    シルエットテスト 20px 合格を目的とした favicon 専用シンボル。
  -->
  <g fill="#ffffff">
    <!-- 左のハサミ（大・単純化） -->
    <path d="M96 120 C72 112 50 116 38 132 C32 140 30 150 32 160 C44 154 52 144 58 134 C70 130 84 130 96 134 Z"/>
    <circle cx="40" cy="150" r="18"/>
    <!-- 右のハサミ（対称） -->
    <path d="M144 120 C168 112 190 116 202 132 C208 140 210 150 208 160 C196 154 188 144 182 134 C170 130 156 130 144 134 Z"/>
    <circle cx="200" cy="150" r="18"/>
    <!-- 丸い体（ドミナントシェイプ） -->
    <ellipse cx="120" cy="124" rx="50" ry="56"/>
  </g>
  <!-- 目（赤地に抜き＝白丸の上に赤目で視認性確保） -->
  <circle cx="104" cy="116" r="11" fill="#dc2626"/>
  <circle cx="136" cy="116" r="11" fill="#dc2626"/>
  <!-- やさしい口 -->
  <path d="M110 142 C116 150 124 150 130 142" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
</svg>
