<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="ザリダスのマスコット（アメリカザリガニ）">
  <!--
    ザリダス マスコット「ザリくん」
    シェイプ言語: ドミナントシェイプ=丸（やさしい・安全・親しみ）。
    識別フック: 大きなハサミ(2本)＋カールした尾扇 = アメリカザリガニと一目で分かる。
    限定パレット(70/25/5): ブランド赤(#dc2626/#b91c1c) 約70 / クリーム生地・白(#fff7ed/#ffffff) 約25 / 目・触角の濃色(#7f1d1d) 約5。
    絵文字非依存・パス主体。装飾用途のため利用側で aria-hidden を付与すること。
  -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- 触角（2本・曲線） -->
  <path d="M104 70 C90 44 70 30 50 26" fill="none" stroke="#b91c1c" stroke-width="7" stroke-linecap="round"/>
  <path d="M136 70 C150 44 170 30 190 26" fill="none" stroke="#b91c1c" stroke-width="7" stroke-linecap="round"/>

  <!-- 左のハサミ（識別フック1） -->
  <g>
    <path d="M86 116 C62 110 44 116 36 132" fill="none" stroke="#dc2626" stroke-width="13" stroke-linecap="round"/>
    <!-- はさみの上爪 -->
    <path d="M40 134 C22 120 18 100 30 86 C42 94 46 110 44 124 Z" fill="#dc2626"/>
    <!-- はさみの下爪 -->
    <path d="M40 134 C24 142 16 132 18 116 C30 116 38 124 44 132 Z" fill="#b91c1c"/>
  </g>

  <!-- 右のハサミ（識別フック1・対称） -->
  <g>
    <path d="M154 116 C178 110 196 116 204 132" fill="none" stroke="#dc2626" stroke-width="13" stroke-linecap="round"/>
    <path d="M200 134 C218 120 222 100 210 86 C198 94 194 110 196 124 Z" fill="#dc2626"/>
    <path d="M200 134 C216 142 224 132 222 116 C210 116 202 124 196 132 Z" fill="#b91c1c"/>
  </g>

  <!-- 歩脚（左右各3本・小） -->
  <g stroke="#b91c1c" stroke-width="6" stroke-linecap="round">
    <path d="M92 150 C76 156 66 164 60 176" fill="none"/>
    <path d="M96 162 C82 170 74 180 70 192" fill="none"/>
    <path d="M148 150 C164 156 174 164 180 176" fill="none"/>
    <path d="M144 162 C158 170 166 180 170 192" fill="none"/>
  </g>

  <!-- カールした尾扇（識別フック2） -->
  <path d="M104 184 C108 206 132 206 136 184 C150 196 150 214 134 222 C120 228 100 226 96 210 C93 198 96 188 104 184 Z" fill="#b91c1c"/>
  <path d="M108 188 C112 202 128 202 132 188" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

  <!-- 体（丸い甲＝ドミナントシェイプ） -->
  <ellipse cx="120" cy="126" rx="46" ry="52" fill="url(#bodyGrad)"/>
  <!-- 甲のハイライト -->
  <ellipse cx="106" cy="108" rx="14" ry="18" fill="#ffffff" fill-opacity="0.22"/>
  <!-- 甲の分節ライン -->
  <path d="M86 142 C104 152 136 152 154 142" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 158 C104 166 136 166 150 158" fill="none" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 顔（やさしい・親しみ） -->
  <!-- 目（白目＋黒目＋ハイライト） -->
  <circle cx="104" cy="116" r="13" fill="#ffffff"/>
  <circle cx="136" cy="116" r="13" fill="#ffffff"/>
  <circle cx="106" cy="118" r="6.5" fill="#7f1d1d"/>
  <circle cx="134" cy="118" r="6.5" fill="#7f1d1d"/>
  <circle cx="108" cy="115" r="2.2" fill="#ffffff"/>
  <circle cx="136" cy="115" r="2.2" fill="#ffffff"/>
  <!-- ほっぺ -->
  <circle cx="92" cy="132" r="6" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="148" cy="132" r="6" fill="#ffffff" fill-opacity="0.35"/>
  <!-- 口（やさしい笑み） -->
  <path d="M112 136 C118 142 122 142 128 136" fill="none" stroke="#7f1d1d" stroke-width="3.5" stroke-linecap="round"/>
</svg>
